# CI: format, lint, build, Lune tests and a short sim smoke run on every push and pull request.
# Tools come from rokit.toml (same pins as local). No secrets needed: the built-in GITHUB_TOKEN only
# raises the GitHub API rate limit for Rokit's downloads.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install tools (rokit.toml)
        run: |
          rokit authenticate github --token "${{ github.token }}"
          rokit install --no-trust-check

      - name: StyLua (format check)
        run: stylua --check src

      - name: Selene (lint)
        run: selene src

      - name: Rojo build
        run: rojo build default.project.json -o build.rbxlx

      - name: Lune tests
        run: lune run tests/run.luau

      # A few matches only: proves the sim still runs end to end, not a balance report.
      - name: Sim smoke run
        timeout-minutes: 2
        run: lune run sim/run.luau 3 8

  # Type check with the Roblox definitions. Informational: the codebase is nonstrict and has never
  # been checked in CI, so this job reports problems without failing the run.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install tools (rokit.toml + luau-lsp)
        run: |
          rokit authenticate github --token "${{ github.token }}"
          rokit install --no-trust-check
          rokit add --no-trust-check JohnnyMorganz/luau-lsp

      - name: luau-lsp analyze
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          curl -sSfL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json src
